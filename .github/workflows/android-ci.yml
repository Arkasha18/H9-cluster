name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build pinned toolchain image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --tag h9-cluster-build:ci \
            .

      - name: Build debug APK and run Android Lint
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env GRADLE_USER_HOME=/workspace/.gradle-ci \
            h9-cluster-build:ci \
            ./gradlew --no-daemon --stacktrace assembleDebug lint

      - name: Upload debug APK and lint reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h9-cluster-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish build environment to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image_repo="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/h9-cluster-build"
          short_sha="${GITHUB_SHA:0:12}"
          docker tag h9-cluster-build:ci "${image_repo}:android35-jdk17"
          docker tag h9-cluster-build:ci "${image_repo}:sha-${short_sha}"
          docker push "${image_repo}:android35-jdk17"
          docker push "${image_repo}:sha-${short_sha}"

      - name: Log out from GitHub Container Registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io
