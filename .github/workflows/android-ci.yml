name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned toolchain image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --tag h9-cluster-build:ci \
            .

      - name: Smoke-test theme tooling
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            h9-cluster-build:ci \
            bash -euo pipefail -c '
              smoke_dir=/workspace/.gradle-ci/theme-smoke
              mkdir -p "${smoke_dir}/forum-kit"
              python tools/build_forum_design_template.py \
                --output-dir "${smoke_dir}/forum-kit" \
                --gradient-source app/src/main/assets/dashboard/skins/common/calibrated_edge_background.png
              python tools/edit_classic_background.py \
                --input app/src/main/assets/dashboard/skins/classic/background.png \
                --output "${smoke_dir}/background-classic.png" \
                --overlay-output "${smoke_dir}/background-classic-overlay.png"
              test -s "${smoke_dir}/forum-kit/01_technical_guide.png"
              test -s "${smoke_dir}/background-classic.png"
              test -s "${smoke_dir}/background-classic-overlay.png"
            '

      - name: Test, lint, and build debug and Demo APKs
        if: github.event_name != 'workflow_dispatch'
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env GRADLE_USER_HOME=/workspace/.gradle-ci \
            h9-cluster-build:ci \
            bash -euo pipefail -c '
              ./gradlew --no-daemon --stacktrace \
                testDebugUnitTest testDemoUnitTest \
                lintDebug lintDemo \
                assembleDebug assembleDemo
              tools/verify_demo_apk_secrets.sh \
                app/build/outputs/apk/demo/app-demo.apk
            '

      - name: Build debug APK with TBOX temperature and run Android Lint
        if: github.event_name == 'workflow_dispatch'
        env:
          H9_TBOX_PASSWORD: ${{ secrets.H9_TBOX_PASSWORD }}
        run: |
          test -n "${H9_TBOX_PASSWORD}"
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env GRADLE_USER_HOME=/workspace/.gradle-ci \
            --env H9_TBOX_PASSWORD \
            h9-cluster-build:ci \
            ./gradlew --no-daemon --stacktrace assembleDebug lint

      - name: Upload debug APK and lint reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h9-cluster-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload Demo APK
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h9-cluster-demo-${{ github.sha }}
          path: app/build/outputs/apk/demo/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish build environment to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image_repo="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/h9-cluster-build"
          short_sha="${GITHUB_SHA:0:12}"
          docker tag h9-cluster-build:ci "${image_repo}:android35-jdk17"
          docker tag h9-cluster-build:ci "${image_repo}:sha-${short_sha}"
          docker push "${image_repo}:android35-jdk17"
          docker push "${image_repo}:sha-${short_sha}"

      - name: Log out from GitHub Container Registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io
