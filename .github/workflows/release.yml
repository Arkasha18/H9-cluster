name: Production release

run-name: >-
  ${{ inputs.operation == 'publish' && 'Publish' || 'Verify' }}
  v${{ inputs.version }} at ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only or sign and publish after approval
        required: true
        type: choice
        default: verify
        options:
          - verify
          - publish
      release_type:
        description: Semantic version increment selected by the owner
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Numeric version without v, for example 9.6.0
        required: true
        type: string
      commit_sha:
        description: Exact full 40-character commit SHA to release
        required: true
        type: string
      confirmation:
        description: For publish enter release vX.Y.Z exactly; leave empty for verify
        required: false
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions: {}

jobs:
  resolve_candidate:
    name: Authorize and resolve candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}

    steps:
      - name: Authorize owner and resolve trusted source head
        id: resolve
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.H9_IMMUTABLE_RELEASES_ENABLED }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "Arkasha18" \
              || "${GITHUB_TRIGGERING_ACTOR}" != "Arkasha18" ]]; then
            echo "::error::Only Arkasha18 may run the production release workflow"
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the protected main branch"
            exit 1
          fi
          if [[ "${IMMUTABLE_RELEASES_ENABLED}" != "true" ]]; then
            echo "::error::Immutable Releases must be enabled and attested by repository configuration"
            exit 1
          fi
          if [[ ! "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full lowercase 40-character SHA"
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be numeric X.Y.Z without a leading v"
            exit 1
          fi
          if [[ "${OPERATION}" == "publish" \
              && "${CONFIRMATION}" != "release v${RELEASE_VERSION}" ]]; then
            echo "::error::Publish confirmation must equal release v${RELEASE_VERSION}"
            exit 1
          fi
          if [[ "${RELEASE_TYPE}" == "patch" ]]; then
            source_ref="hotfix/${RELEASE_VERSION}"
          else
            source_ref="main"
          fi
          current_main="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ "${current_main}" != "${CONTROL_COMMIT}" ]]; then
            echo "::error::This workflow run uses an outdated release control plane"
            exit 1
          fi
          candidate_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${source_ref}" \
            --jq '.object.sha')"
          if [[ ! "${candidate_sha}" =~ ^[0-9a-f]{40}$ \
              || "${candidate_sha}" != "${COMMIT_SHA}" ]]; then
            echo "::error::Requested commit is no longer the current source head"
            exit 1
          fi
          {
            printf 'candidate_sha=%s\n' "${candidate_sha}"
            printf 'source_ref=%s\n' "${source_ref}"
          } >> "${GITHUB_OUTPUT}"

  preflight:
    name: Release preflight
    needs: resolve_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      candidate_sha: ${{ needs.resolve_candidate.outputs.candidate_sha }}
      previous_tag: ${{ steps.published_baseline.outputs.previous_tag }}
      previous_version_code: ${{ steps.baseline_apk.outputs.previous_version_code }}
      source_ref: ${{ needs.resolve_candidate.outputs.source_ref }}

    steps:
      - name: Re-authorize resolved request
        env:
          CANDIDATE_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SOURCE_REF: ${{ needs.resolve_candidate.outputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTOR}" == "Arkasha18" ]]
          [[ "${GITHUB_TRIGGERING_ACTOR}" == "Arkasha18" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${CANDIDATE_SHA}" == "${COMMIT_SHA}" ]]
          [[ "${SOURCE_REF}" == "main" || "${SOURCE_REF}" == hotfix/* ]]

      - name: Check out trusted release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_candidate.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate is the current source head
        env:
          COMMIT_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
          SOURCE_REF: ${{ needs.resolve_candidate.outputs.source_ref }}
        run: |
          set -euo pipefail
          git -C candidate fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"
          if [[ "${SOURCE_REF}" != "main" ]]; then
            git -C candidate fetch --force origin \
              "+refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          fi
          remote_head="$(git -C candidate rev-parse "refs/remotes/origin/${SOURCE_REF}")"
          if [[ "${remote_head}" != "${COMMIT_SHA}" ]]; then
            echo "::error::Requested commit is no longer the head of ${SOURCE_REF}"
            exit 1
          fi

      - name: Authorize candidate PR and CI before execution
        env:
          COMMIT_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_REF: ${{ needs.resolve_candidate.outputs.source_ref }}
        run: |
          set -euo pipefail
          python3 control/tools/release/github_gate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${COMMIT_SHA}" \
            --control-commit "${CONTROL_COMMIT}" \
            --release-type "${RELEASE_TYPE}" \
            --source-ref "${SOURCE_REF}"

      - name: Test trusted release tooling
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
        working-directory: control

      - name: Resolve and download latest published baseline
        id: published_baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
          previous_tag="$(jq -r '.tag_name' <<<"${release_json}")"
          if [[ "$(jq -r '.draft' <<<"${release_json}")" != "false" \
              || "$(jq -r '.prerelease' <<<"${release_json}")" != "false" \
              || ! "${previous_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Latest GitHub Release is not a numeric published stable release"
            exit 1
          fi
          previous_version="${previous_tag#v}"
          asset_name="H9_Cluster_v${previous_version}_adminrunet_release.apk"
          asset_count="$(jq \
            --arg name "${asset_name}" \
            '[.assets[] | select(.name == $name and .state == "uploaded" and .size > 0)] | length' \
            <<<"${release_json}")"
          if [[ "${asset_count}" -ne 1 ]]; then
            echo "::error::Latest stable release must contain exactly one expected production APK"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/release-baseline"
          gh release download "${previous_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset_name}" \
            --dir "${RUNNER_TEMP}/release-baseline"
          test -s "${RUNNER_TEMP}/release-baseline/${asset_name}"
          {
            echo "previous_tag=${previous_tag}"
            echo "previous_version=${previous_version}"
            echo "asset_name=${asset_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build pinned toolchain image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "OCI_REVISION=${{ needs.resolve_candidate.outputs.candidate_sha }}" \
            --tag h9-cluster-build:release-preflight \
            control

      - name: Verify public baseline APK and signer
        id: baseline_apk
        env:
          EXPECTED_CERT_SHA256: ${{ vars.H9_RELEASE_CERT_SHA256 }}
          PREVIOUS_ASSET_NAME: ${{ steps.published_baseline.outputs.asset_name }}
          PREVIOUS_VERSION: ${{ steps.published_baseline.outputs.previous_version }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_CERT_SHA256}" =~ ^([0-9a-fA-F]{2}:?){32}$ ]]; then
            echo "::error::H9_RELEASE_CERT_SHA256 is missing or malformed"
            exit 1
          fi
          pinned_cert="e7c84ad0463e88361afc4510a16b18774d4ccc6c0934ed866c93a4902940d610"
          configured_cert="$(printf '%s' "${EXPECTED_CERT_SHA256}" \
            | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [[ "${configured_cert}" != "${pinned_cert}" ]]; then
            echo "::error::Configured certificate differs from the reviewed control-plane pin"
            exit 1
          fi
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/control:/release-control:ro" \
            --volume "${RUNNER_TEMP}/release-baseline:/release-state" \
            --workdir /release-state \
            h9-cluster-build:release-preflight \
            python3 /release-control/tools/release/release_tool.py verify-apk \
              --apk "/release-state/${PREVIOUS_ASSET_NAME}" \
              --version "${PREVIOUS_VERSION}" \
              --aapt /opt/android-sdk/build-tools/35.0.0/aapt \
              --apksigner /opt/android-sdk/build-tools/35.0.0/apksigner \
              --zipalign /opt/android-sdk/build-tools/35.0.0/zipalign \
              --expected-cert-sha256 "${EXPECTED_CERT_SHA256}" \
              --enforce-release-name \
              --output-json /release-state/baseline-apk.json
          previous_version_code="$(jq -r '.version_code' \
            "${RUNNER_TEMP}/release-baseline/baseline-apk.json")"
          if [[ ! "${previous_version_code}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Public baseline APK has an invalid versionCode"
            exit 1
          fi
          printf 'previous_version_code=%s\n' "${previous_version_code}" \
            >> "${GITHUB_OUTPUT}"

      - name: Verify release metadata and changelog
        env:
          COMMIT_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
          PREVIOUS_TAG: ${{ steps.published_baseline.outputs.previous_tag }}
          PREVIOUS_VERSION_CODE: ${{ steps.baseline_apk.outputs.previous_version_code }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ needs.resolve_candidate.outputs.source_ref }}
        run: |
          set -euo pipefail
          python3 control/tools/release/release_tool.py verify \
            --repo candidate \
            --version "${RELEASE_VERSION}" \
            --release-type "${RELEASE_TYPE}" \
            --commit "${COMMIT_SHA}" \
            --source-ref "${SOURCE_REF}" \
            --main-ref refs/remotes/origin/main \
            --previous-tag "${PREVIOUS_TAG}" \
            --previous-version-code "${PREVIOUS_VERSION_CODE}" \
            --output-json "${RUNNER_TEMP}/release-metadata.json" \
            --output-notes "${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Release candidate"
            echo
            cat "${RUNNER_TEMP}/release-metadata.json"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Recheck exact successful CI and eligible PR
        env:
          COMMIT_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_REF: ${{ needs.resolve_candidate.outputs.source_ref }}
        run: |
          set -euo pipefail
          python3 control/tools/release/github_gate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${COMMIT_SHA}" \
            --control-commit "${CONTROL_COMMIT}" \
            --release-type "${RELEASE_TYPE}" \
            --source-ref "${SOURCE_REF}"

      - name: Reject an existing published target release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          if release_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            if [[ "$(jq -r '.draft' <<<"${release_json}")" != "true" ]]; then
              echo "::error::${RELEASE_TAG} is already published"
              exit 1
            fi
            echo "Existing draft ${RELEASE_TAG} may be resumed only by rerunning the failed job."
          fi

      - name: Smoke-test theme tooling
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/candidate:/workspace" \
            --workdir /workspace \
            h9-cluster-build:release-preflight \
            bash -euo pipefail -c '
              smoke_dir=/workspace/.gradle-ci/theme-smoke
              mkdir -p "${smoke_dir}/forum-kit"
              python tools/build_forum_design_template.py \
                --output-dir "${smoke_dir}/forum-kit" \
                --gradient-source app/src/main/assets/dashboard/skins/common/calibrated_edge_background.png
              python tools/edit_classic_background.py \
                --input app/src/main/assets/dashboard/skins/classic/background.png \
                --output "${smoke_dir}/background-classic.png" \
                --overlay-output "${smoke_dir}/background-classic-overlay.png"
              test -s "${smoke_dir}/forum-kit/01_technical_guide.png"
              test -s "${smoke_dir}/background-classic.png"
              test -s "${smoke_dir}/background-classic-overlay.png"
            '

      - name: Run complete secretless validation
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/candidate:/workspace" \
            --workdir /workspace \
            --env GRADLE_USER_HOME=/workspace/.gradle-ci \
            h9-cluster-build:release-preflight \
            bash -euo pipefail -c '
              ./gradlew --no-daemon --stacktrace clean \
                testDebugUnitTest testDemoUnitTest testReleaseUnitTest \
                lintDebug lintDemo lintRelease \
                assembleDebug assembleDemo assembleRelease
              tools/verify_demo_apk_secrets.sh \
                app/build/outputs/apk/demo/app-demo.apk
            '

      - name: Verify secretless Release APK metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mapfile -t release_apks < <(
            find "${GITHUB_WORKSPACE}/candidate/app/build/outputs/apk/release" \
              -maxdepth 1 -type f -name '*-unsigned.apk' -print
          )
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one unsigned Release APK"
            exit 1
          fi
          version_code="$(jq -r '.version_code' "${RUNNER_TEMP}/release-metadata.json")"
          candidate_prefix="${GITHUB_WORKSPACE}/candidate/"
          relative_apk="${release_apks[0]#${candidate_prefix}}"
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/candidate:/workspace:ro" \
            --volume "${GITHUB_WORKSPACE}/control:/release-control:ro" \
            --workdir /workspace \
            h9-cluster-build:release-preflight \
            python3 /release-control/tools/release/release_tool.py verify-apk \
              --apk "/workspace/${relative_apk}" \
              --version "${RELEASE_VERSION}" \
              --version-code "${version_code}" \
              --aapt /opt/android-sdk/build-tools/35.0.0/aapt \
              --apksigner /opt/android-sdk/build-tools/35.0.0/apksigner \
              --expect-unsigned

  production_build:
    name: Build production unsigned APK
    if: inputs.operation == 'publish'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Re-authorize owner
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTOR}" == "Arkasha18" ]]
          [[ "${GITHUB_TRIGGERING_ACTOR}" == "Arkasha18" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${CONFIRMATION}" == "release v${RELEASE_VERSION}" ]]

      - name: Check out trusted release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate source head and release metadata
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CONTROL_COMMIT: ${{ github.sha }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          PREVIOUS_VERSION_CODE: ${{ needs.preflight.outputs.previous_version_code }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
        run: |
          set -euo pipefail
          git -C candidate fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"
          if [[ "${SOURCE_REF}" != "main" ]]; then
            git -C candidate fetch --force origin \
              "+refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          fi
          remote_head="$(git -C candidate rev-parse "refs/remotes/origin/${SOURCE_REF}")"
          [[ "${remote_head}" == "${COMMIT_SHA}" ]]
          current_main="$(git -C candidate rev-parse refs/remotes/origin/main)"
          [[ "${current_main}" == "${CONTROL_COMMIT}" ]]
          python3 control/tools/release/release_tool.py verify \
            --repo candidate \
            --version "${RELEASE_VERSION}" \
            --release-type "${RELEASE_TYPE}" \
            --commit "${COMMIT_SHA}" \
            --source-ref "${SOURCE_REF}" \
            --main-ref refs/remotes/origin/main \
            --previous-tag "${PREVIOUS_TAG}" \
            --previous-version-code "${PREVIOUS_VERSION_CODE}" \
            --output-json "${RUNNER_TEMP}/release-metadata.json" \
            --output-notes "${RUNNER_TEMP}/release-notes.md"

      - name: Build pinned toolchain image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "OCI_REVISION=${{ needs.preflight.outputs.candidate_sha }}" \
            --tag h9-cluster-build:production \
            control

      - name: Recheck candidate PR and CI before production execution
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
        run: |
          set -euo pipefail
          python3 control/tools/release/github_gate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${COMMIT_SHA}" \
            --control-commit "${CONTROL_COMMIT}" \
            --release-type "${RELEASE_TYPE}" \
            --source-ref "${SOURCE_REF}"

      - name: Build production APK with TBOX support
        env:
          H9_TBOX_PASSWORD: ${{ secrets.H9_TBOX_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${H9_TBOX_PASSWORD}" ]]; then
            echo "::error::Repository secret H9_TBOX_PASSWORD is not configured"
            exit 1
          fi
          export H9_RELEASE_EXPECTED_TBOX_PASSWORD="${H9_TBOX_PASSWORD}"
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/candidate:/workspace" \
            --workdir /workspace \
            --env GRADLE_USER_HOME=/workspace/.gradle-ci \
            --env H9_RELEASE_EXPECTED_TBOX_PASSWORD \
            --env H9_TBOX_PASSWORD \
            h9-cluster-build:production \
            ./gradlew --no-daemon --stacktrace clean \
              testReleaseUnitTest assembleRelease

          mapfile -t build_configs < <(
            find candidate/app/build/generated/source/buildConfig/release \
              -type f -name BuildConfig.java -print
          )
          mapfile -t release_apks < <(
            find candidate/app/build/outputs/apk/release \
              -maxdepth 1 -type f -name '*-unsigned.apk' -print
          )
          if [[ "${#build_configs[@]}" -ne 1 \
              || "${#release_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected one generated BuildConfig and one unsigned APK"
            exit 1
          fi
          python3 control/tools/release/release_tool.py verify-tbox \
            --build-config "${build_configs[0]}" \
            --apk "${release_apks[0]}"

      - name: Verify and package unsigned APK
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mapfile -t release_apks < <(
            find "${GITHUB_WORKSPACE}/candidate/app/build/outputs/apk/release" \
              -maxdepth 1 -type f -name '*-unsigned.apk' -print
          )
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one unsigned production APK"
            exit 1
          fi
          version_code="$(jq -r '.version_code' "${RUNNER_TEMP}/release-metadata.json")"
          candidate_prefix="${GITHUB_WORKSPACE}/candidate/"
          relative_apk="${release_apks[0]#${candidate_prefix}}"
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/candidate:/workspace:ro" \
            --volume "${GITHUB_WORKSPACE}/control:/release-control:ro" \
            --workdir /workspace \
            h9-cluster-build:production \
            python3 /release-control/tools/release/release_tool.py verify-apk \
              --apk "/workspace/${relative_apk}" \
              --version "${RELEASE_VERSION}" \
              --version-code "${version_code}" \
              --aapt /opt/android-sdk/build-tools/35.0.0/aapt \
              --apksigner /opt/android-sdk/build-tools/35.0.0/apksigner \
              --expect-unsigned

          asset_name="$(jq -r '.asset_name' "${RUNNER_TEMP}/release-metadata.json")"
          unsigned_name="${asset_name%.apk}-unsigned.apk"
          mkdir -p release-package
          cp "${release_apks[0]}" "release-package/${unsigned_name}"
          cp "${RUNNER_TEMP}/release-metadata.json" release-package/release-metadata.json
          cp "${RUNNER_TEMP}/release-notes.md" release-package/release-notes.md
          cp control/tools/release/github_gate.py release-package/release-gate.py

      - name: Upload immutable unsigned handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-unsigned-${{ needs.preflight.outputs.candidate_sha }}
          path: release-package/
          if-no-files-found: error
          retention-days: 1

  sign_and_publish:
    name: Sign and publish
    if: inputs.operation == 'publish'
    needs:
      - preflight
      - production_build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Re-authorize owner after approval
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTOR}" == "Arkasha18" ]]
          [[ "${GITHUB_TRIGGERING_ACTOR}" == "Arkasha18" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${CONFIRMATION}" == "release v${RELEASE_VERSION}" ]]

      - name: Download exact unsigned handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-unsigned-${{ needs.preflight.outputs.candidate_sha }}
          path: unsigned

      - name: Validate immutable handoff metadata
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          PREVIOUS_VERSION_CODE: ${{ needs.preflight.outputs.previous_version_code }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
        run: |
          set -euo pipefail
          jq -e \
            --arg commit "${COMMIT_SHA}" \
            --arg previous_tag "${PREVIOUS_TAG}" \
            --argjson previous_version_code "${PREVIOUS_VERSION_CODE}" \
            --arg release_type "${RELEASE_TYPE}" \
            --arg source_ref "${SOURCE_REF}" \
            --arg version "${RELEASE_VERSION}" \
            '
              .commit == $commit
              and .previous_tag == $previous_tag
              and .previous_version_code == $previous_version_code
              and .release_type == $release_type
              and .source_ref == $source_ref
              and .version == $version
              and .tag == ("v" + $version)
              and .asset_name == ("H9_Cluster_v" + $version + "_adminrunet_release.apk")
              and (.version_code | type == "number")
              and .version_code > $previous_version_code
            ' unsigned/release-metadata.json >/dev/null
          test -s unsigned/release-notes.md
          test -s unsigned/release-gate.py

      - name: Ensure Android signing tools are available
        run: |
          set -euo pipefail
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          if [[ ! -x "${build_tools}/apksigner" \
              || ! -x "${build_tools}/zipalign" \
              || ! -x "${build_tools}/aapt" ]]; then
            set +o pipefail
            yes | sdkmanager "build-tools;35.0.0" >/dev/null
            set -o pipefail
          fi
          "${build_tools}/apksigner" version

      - name: Align, sign, and verify without repository checkout
        env:
          H9_RELEASE_CERT_SHA256: ${{ vars.H9_RELEASE_CERT_SHA256 }}
          H9_RELEASE_KEY_ALIAS: ${{ secrets.H9_RELEASE_KEY_ALIAS }}
          H9_RELEASE_KEY_PASSWORD: ${{ secrets.H9_RELEASE_KEY_PASSWORD }}
          H9_RELEASE_KEYSTORE_B64: ${{ secrets.H9_RELEASE_KEYSTORE_B64 }}
          H9_RELEASE_STORE_PASSWORD: ${{ secrets.H9_RELEASE_STORE_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          for required in \
              H9_RELEASE_CERT_SHA256 \
              H9_RELEASE_KEY_ALIAS \
              H9_RELEASE_KEY_PASSWORD \
              H9_RELEASE_KEYSTORE_B64 \
              H9_RELEASE_STORE_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Required release environment value is missing"
              exit 1
            fi
          done

          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          metadata=unsigned/release-metadata.json
          asset_name="$(jq -r '.asset_name' "${metadata}")"
          version_code="$(jq -r '.version_code' "${metadata}")"
          unsigned_name="${asset_name%.apk}-unsigned.apk"
          unsigned_apk="unsigned/${unsigned_name}"
          keystore="${RUNNER_TEMP}/h9-release-keystore.p12"
          aligned_apk="${RUNNER_TEMP}/h9-release-aligned.apk"
          mkdir -p release-output
          signed_apk="release-output/${asset_name}"

          cleanup() {
            rm -f "${keystore}" "${aligned_apk}"
          }
          trap cleanup EXIT

          printf '%s' "${H9_RELEASE_KEYSTORE_B64}" \
            | base64 --decode > "${keystore}"
          test -s "${keystore}"
          "${build_tools}/zipalign" -P 16 -f 4 "${unsigned_apk}" "${aligned_apk}"
          "${build_tools}/apksigner" sign \
            --ks "${keystore}" \
            --ks-type PKCS12 \
            --ks-key-alias "${H9_RELEASE_KEY_ALIAS}" \
            --ks-pass env:H9_RELEASE_STORE_PASSWORD \
            --key-pass env:H9_RELEASE_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "${signed_apk}" \
            "${aligned_apk}"

          verify_output="$("${build_tools}/apksigner" verify \
            --Werr --verbose --print-certs "${signed_apk}")"
          printf '%s\n' "${verify_output}"
          mapfile -t signer_counts < <(
            printf '%s\n' "${verify_output}" \
              | sed -n 's/^Number of signers: \([0-9][0-9]*\)$/\1/p'
          )
          if [[ "${#signer_counts[@]}" -ne 1 \
              || "${signer_counts[0]}" != "1" ]]; then
            echo "::error::Signed APK must have exactly one signer"
            exit 1
          fi
          actual_cert="$(printf '%s\n' "${verify_output}" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          expected_cert="$(printf '%s' "${H9_RELEASE_CERT_SHA256}" \
            | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          pinned_cert="e7c84ad0463e88361afc4510a16b18774d4ccc6c0934ed866c93a4902940d610"
          if [[ "${expected_cert}" != "${pinned_cert}" ]]; then
            echo "::error::Configured certificate differs from the reviewed control-plane pin"
            exit 1
          fi
          actual_cert="$(printf '%s' "${actual_cert}" \
            | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [[ "${actual_cert}" != "${expected_cert}" ]]; then
            echo "::error::Signer certificate does not match the pinned production certificate"
            exit 1
          fi

          "${build_tools}/zipalign" -c -P 16 4 "${signed_apk}"
          badging="$("${build_tools}/aapt" dump badging "${signed_apk}")"
          grep -Fq "package: name='net.adminrunet.h9cluster' versionCode='${version_code}' versionName='${RELEASE_VERSION}'" \
            <<<"${badging}"
          grep -Fxq "native-code: 'arm64-v8a'" <<<"${badging}"
          if grep -Fq "application-debuggable" <<<"${badging}"; then
            echo "::error::Signed production APK is debuggable"
            exit 1
          fi

          (
            cd release-output
            sha256sum "${asset_name}" > SHA256SUMS
          )

      - name: Create immutable GitHub Release
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.H9_IMMUTABLE_RELEASES_ENABLED }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "${IMMUTABLE_RELEASES_ENABLED}" != "true" ]]; then
            echo "::error::Immutable Releases configuration attestation changed"
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          metadata=unsigned/release-metadata.json
          asset_name="$(jq -r '.asset_name' "${metadata}")"
          apk="release-output/${asset_name}"
          checksums=release-output/SHA256SUMS
          expected_title="H9 Cluster ${tag}"
          expected_body="$(cat unsigned/release-notes.md)"

          assert_ci_and_pr() {
            python3 unsigned/release-gate.py \
              --repository "${GITHUB_REPOSITORY}" \
              --commit "${COMMIT_SHA}" \
              --control-commit "${CONTROL_COMMIT}" \
              --release-type "${RELEASE_TYPE}" \
              --source-ref "${SOURCE_REF}"
          }

          assert_source_and_baseline() {
            remote_head="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_REF}" \
              --jq '.object.sha')"
            if [[ "${remote_head}" != "${COMMIT_SHA}" ]]; then
              echo "::error::${SOURCE_REF} moved while release approval was pending"
              exit 1
            fi
            latest_tag="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name')"
            if [[ "${latest_tag}" != "${PREVIOUS_TAG}" ]]; then
              echo "::error::Another stable release was published after preflight"
              exit 1
            fi
          }

          assert_tag_commit() {
            tag_ref="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            if [[ "$(jq -r '.object.type' <<<"${tag_ref}")" != "tag" ]]; then
              echo "::error::${tag} is not an annotated tag"
              exit 1
            fi
            resolved_commit="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha')"
            if [[ "${resolved_commit}" != "${COMMIT_SHA}" ]]; then
              echo "::error::${tag} does not resolve to the approved commit"
              exit 1
            fi
          }

          validate_release_metadata() {
            local release_json="$1"
            local actual_body
            actual_body="$(jq -r '.body' <<<"${release_json}")"
            if [[ "$(jq -r '.isPrerelease' <<<"${release_json}")" != "false" \
                || "$(jq -r '.tagName' <<<"${release_json}")" != "${tag}" \
                || "$(jq -r '.name' <<<"${release_json}")" != "${expected_title}" \
                || "$(jq -r '.targetCommitish' <<<"${release_json}")" != "main" \
                || "${actual_body}" != "${expected_body}" ]]; then
              echo "::error::Existing draft metadata differs from the approved release"
              exit 1
            fi
          }

          validate_draft() {
            local release_json="$1"
            validate_release_metadata "${release_json}"
            if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != "true" ]]; then
              echo "::error::Release is no longer a draft"
              exit 1
            fi
          }

          assert_ci_and_pr
          assert_source_and_baseline
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            assert_tag_commit
          else
            tag_object_sha="$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${tag}" \
              -f message="H9 Cluster ${tag}" \
              -f object="${COMMIT_SHA}" \
              -f type=commit \
              --jq '.sha')"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${tag_object_sha}" >/dev/null
            assert_tag_commit
          fi

          if release_json="$(gh release view "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json name,body,isDraft,isPrerelease,tagName,targetCommitish,assets \
              2>/dev/null)"; then
            validate_draft "${release_json}"
            unexpected_assets="$(jq \
              --arg apk "${asset_name}" \
              '[.assets[] | select(.name != $apk and .name != "SHA256SUMS")] | length' \
              <<<"${release_json}")"
            if [[ "${unexpected_assets}" -ne 0 ]]; then
              echo "::error::Draft contains unexpected assets"
              exit 1
            fi
            for local_asset in "${apk}" "${checksums}"; do
              name="$(basename "${local_asset}")"
              if jq -e --arg name "${name}" \
                  'any(.assets[]; .name == $name)' \
                  <<<"${release_json}" >/dev/null; then
                existing_dir="${RUNNER_TEMP}/existing-${name}"
                mkdir -p "${existing_dir}"
                gh release download "${tag}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${name}" \
                  --dir "${existing_dir}"
                cmp "${local_asset}" "${existing_dir}/${name}"
              else
                gh release upload "${tag}" "${local_asset}" \
                  --repo "${GITHUB_REPOSITORY}"
              fi
            done
          else
            gh release create "${tag}" "${apk}" "${checksums}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --title "${expected_title}" \
              --notes-file unsigned/release-notes.md
          fi

          release_json="$(gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,body,isDraft,isPrerelease,tagName,targetCommitish,assets)"
          validate_draft "${release_json}"
          asset_names="$(jq \
            --arg apk "${asset_name}" \
            '[.assets[].name] | sort == ([$apk, "SHA256SUMS"] | sort)' \
            <<<"${release_json}")"
          if [[ "${asset_names}" != "true" ]]; then
            echo "::error::Draft asset set is incomplete or unexpected"
            exit 1
          fi

          draft_dir="${RUNNER_TEMP}/verified-draft-assets"
          mkdir -p "${draft_dir}"
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${draft_dir}"
          cmp "${apk}" "${draft_dir}/${asset_name}"
          cmp "${checksums}" "${draft_dir}/SHA256SUMS"

          assert_ci_and_pr
          assert_source_and_baseline
          assert_tag_commit

          final_draft_json="$(gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,body,isDraft,isPrerelease,tagName,targetCommitish,assets)"
          validate_draft "${final_draft_json}"
          final_asset_names="$(jq \
            --arg apk "${asset_name}" \
            '[.assets[].name] | sort == ([$apk, "SHA256SUMS"] | sort)' \
            <<<"${final_draft_json}")"
          if [[ "${final_asset_names}" != "true" ]]; then
            echo "::error::Draft asset set changed during final release gate"
            exit 1
          fi
          final_draft_dir="${RUNNER_TEMP}/final-draft-assets"
          mkdir -p "${final_draft_dir}"
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${final_draft_dir}"
          cmp "${apk}" "${final_draft_dir}/${asset_name}"
          cmp "${checksums}" "${final_draft_dir}/SHA256SUMS"

          gh release edit "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease=false \
            --latest

          published="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          [[ "$(jq -r '.draft' <<<"${published}")" == "false" ]]
          [[ "$(jq -r '.prerelease' <<<"${published}")" == "false" ]]
          [[ "$(jq -r '.immutable' <<<"${published}")" == "true" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" == "${tag}" ]]
          published_view="$(gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,body,isDraft,isPrerelease,tagName,targetCommitish,assets)"
          validate_release_metadata "${published_view}"
          [[ "$(jq -r '.isDraft' <<<"${published_view}")" == "false" ]]
          assert_tag_commit

          public_dir="${RUNNER_TEMP}/verified-public-assets"
          mkdir -p "${public_dir}"
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${public_dir}"
          cmp "${apk}" "${public_dir}/${asset_name}"
          cmp "${checksums}" "${public_dir}/SHA256SUMS"
          (
            cd "${public_dir}"
            sha256sum --check SHA256SUMS
          )

          {
            echo "## Published ${tag}"
            echo
            echo "- Commit: ${COMMIT_SHA}"
            echo "- APK: ${asset_name}"
            echo "- Immutable release: yes"
          } >> "${GITHUB_STEP_SUMMARY}"
