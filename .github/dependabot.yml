version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    reviewers:
      - Arkasha18
    labels:
      - dependencies
    ignore:
      # Android Gradle Plugin and the wrapper must be upgraded together after
      # checking their compatibility. Isolated updates break the build even
      # when Dependabot classifies them as minor releases.
      - dependency-name: com.android.application
      - dependency-name: gradle-wrapper

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    reviewers:
      - Arkasha18
    labels:
      - dependencies
    ignore:
      # JDK 17 is the supported project toolchain. A major base-image update
      # must be tested and adopted intentionally.
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    reviewers:
      - Arkasha18
    labels:
      - dependencies
