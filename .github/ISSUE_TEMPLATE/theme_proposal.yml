name: Предложить тему
description: Макет новой темы приборной панели 1920×720
title: "[Theme]: "
labels:
  - theme
body:
  - type: input
    id: name
    attributes:
      label: Название темы
    validations:
      required: true
  - type: textarea
    id: concept
    attributes:
      label: Концепция и особенности
      description: Чем формы приборов, материалы и типографика отличаются от существующих скинов? Как сохранено место для карты?
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Макеты и исходники
      description: Приложите фронтальные PNG 1920×720 на чёрном фоне, светлой и тёмной карте, а также тот же макет с техническими полями 05. Добавьте паспорт координат и лицензии ресурсов. Укажите, это эскиз, нативный Demo-рендер или снимок автомобиля.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка системных зон
      options:
        - label: Нижние левые поля 06 свободны от добавленной графики с запасом 1 px; декор под полями 07 не содержит важных показаний.
          required: true
        - label: Центральная область карты не перекрыта непрозрачной графикой.
          required: true
        - label: Есть все показания из FORUM_DESIGN_PROMPTS_RU.md, включая время, дату и Wi-Fi; нет дублей букв селектора и режима движения, номер D остаётся в штатной зоне.
          required: true
        - label: Цифры и подписи центрированы по приборам; в исходнике оформления нет запечённых изменяемых значений.
          required: true
        - label: Все ресурсы оригинальные либо имеют совместимую лицензию.
          required: true
